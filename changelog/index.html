<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Record — Memoix</title>
  <meta name="description" content="Changelog for Memoix." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Cormorant+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:        #e8b4a0;
      --ink-soft:   #e8d5c4;
      --ink-muted:  #9b9b9b;
      --accent1:    #a88fa8;
      --rule:       #3f3f46;
      --paper:      #242424;
      --paper-dark: #1a1a1a;
    }

    body {
      background: var(--paper-dark);
      color: var(--ink-soft);
      font-family: 'EB Garamond', serif;
      line-height: 1.7;
      font-size: 18px;
      overflow-x: hidden;
    }

    /* ── NAV ─────────────────────────────────────── */

    .nav-top {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 1.6rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 400;
      pointer-events: none;
    }

    .back-link {
      font-family: 'Cormorant SC', serif;
      color: var(--ink-muted);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: color 0.2s;
      pointer-events: all;
    }
    .back-link:hover { color: var(--ink); }

    .nav-toggle {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px;
      pointer-events: all;
    }
    .nav-toggle span {
      display: block;
      width: 20px;
      height: 1px;
      background: var(--ink-muted);
      transition: background 0.2s, opacity 0.2s, transform 0.25s;
    }
    .nav-toggle:hover span { background: var(--ink); }
    .nav-toggle.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); background: var(--ink); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); background: var(--ink); }

    .nav-overlay {
      position: fixed;
      inset: 0;
      background: var(--paper-dark);
      z-index: 300;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 8vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.open { opacity: 1; pointer-events: all; }

    .nav-overlay a,
    .nav-link-current {
      font-family: 'Cormorant SC', serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.06em;
      line-height: 1.3;
      display: block;
      margin-bottom: 0.5rem;
      text-decoration: none;
    }
    .nav-overlay a { color: var(--ink-muted); transition: color 0.2s; }
    .nav-overlay a:hover { color: var(--ink); }
    .nav-link-current { color: var(--ink); cursor: default; }

    .nav-rule { width: 2rem; height: 1px; background: var(--rule); margin: 2rem 0; }
    .nav-meta {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }

    /* ── PAGE HEADER ─────────────────────────────── */

    .page-header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10rem 2rem 4rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 5rem);
      color: var(--ink);
      line-height: 0.95;
      margin-bottom: 0.5rem;
    }

    .page-subtitle {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }

    /* ── CARD STREAM ─────────────────────────────── */

    .card-stream {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 2rem 6rem;
    }

    .release-card {
      background: var(--paper);
      border-radius: 6px;
      padding: 2rem 2rem 1.5rem;
      margin-bottom: 2.5rem;
      width: 90%;
    }

    .offset-left  { margin-right: auto; margin-left: 12%; }
    .offset-right { margin-left: auto;  margin-right: 12%; }

    /* ── CARD HEADER ─────────────────────────────── */

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--rule);
    }

    .card-version {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--ink);
      line-height: 1.2;
    }

    .card-date {
      font-family: 'Cormorant SC', serif;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      color: var(--ink-muted);
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .release-type {
      font-family: 'Cormorant SC', serif;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.2rem 0.65rem;
      border: 1px solid currentColor;
      border-radius: 2px;
      white-space: nowrap;
      margin-top: 0.2rem;
    }

    .release-type.major { color: var(--ink); }
    .release-type.minor { color: var(--accent1); }
    .release-type.patch { color: var(--ink-muted); }

    /* ── CARD ENTRIES ────────────────────────────── */

    .card-entries {
      padding-top: 1.2rem;
    }

    /* Category group wrapper — adds extra top space before each new group */
    .entry-group {
      margin-bottom: 1.4rem;
    }

    .entry-group:last-child {
      margin-bottom: 0;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 1fr 4.5rem;
      gap: 0 1rem;
      padding: 0.3rem 0;
      align-items: baseline;
    }

    .entry-text {
      font-size: 1rem;
      color: var(--ink-soft);
      line-height: 1.6;
    }

    .entry-text code {
      font-family: monospace;
      font-size: 0.85em;
      color: var(--ink-muted);
      padding: 0.1em 0.3em;
      border-radius: 2px;
    }

    .entry-bracket {
      font-family: 'Cormorant SC', serif;
      font-size: 0.75em;
      letter-spacing: 0.1em;
      color: var(--ink-muted);
    }

    .entry-tag {
      font-family: 'Cormorant SC', serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: right;
      color: var(--ink-muted);
      padding-top: 0.15rem;
    }

    /* ── CARD FOOTER ─────────────────────────────── */

    .card-foot {
      margin-top: 1.4rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
    }

    .foot-row {
      display: grid;
      grid-template-columns: 1fr 2rem;
      font-family: 'EB Garamond', serif;
      font-size: 0.95rem;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    .foot-val { text-align: right; }

    .foot-row.total-row {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--rule);
      color: var(--ink);
      font-size: 1rem;
    }

    /* ── STATE ───────────────────────────────────── */

    .state-msg {
      font-family: 'Cormorant SC', serif;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 2rem 0;
    }

    .state-msg a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      transition: border-color 0.2s;
    }
    .state-msg a:hover { border-color: var(--ink); }

    /* ── FOOTER ──────────────────────────────────── */

    footer {
      border-top: 1px solid var(--rule);
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
    }

    .footer-brand {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }

    .footer-links {
      display: flex;
      gap: 1.8rem;
      justify-content: center;
    }

    .footer-links a,
    .footer-links .current {
      font-family: 'Cormorant SC', serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: none;
    }
    .footer-links a { color: var(--ink-muted); transition: color 0.2s; }
    .footer-links a:hover { color: var(--ink-soft); }
    .footer-links .current { color: var(--ink); cursor: default; }

    .footer-salt {
      font-family: 'EB Garamond', serif;
      font-size: 0.85rem;
      font-style: italic;
      color: var(--ink-muted);
      text-align: right;
    }

    /* ── RESPONSIVE ──────────────────────────────── */

    @media (max-width: 600px) {
      .release-card { width: 100%; margin-left: 0; margin-right: 0; }
      footer { grid-template-columns: 1fr; text-align: center; gap: 1.2rem; }
      .footer-links { flex-wrap: wrap; justify-content: center; }
      .footer-salt { text-align: center; }
    }
  </style>
</head>
<body>

  <div class="nav-top">
    <a href="../index.html" class="back-link">&larr; Return</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="nav-overlay" id="navOverlay" aria-hidden="true">
    <img src="../assets/logo.svg" style="position: absolute; bottom: -5%; right: -5%; width: 60%; opacity: 0.06; pointer-events: none; z-index: -1; filter: grayscale(1);" alt="" />
    <a href="../features/index.html">Features</a>
    <a href="../about/index.html">About</a>
    <a href="https://github.com/dboiago/Memoix" target="_blank" rel="noopener">Source</a>
    <div class="nav-rule"></div>
    <p class="nav-meta">Memoix &mdash; 2026</p>
  </nav>

  <div class="page-header">
    <h1>The Record.</h1>
    <p class="page-subtitle">Memoix &mdash; Release history</p>
  </div>

  <div class="card-stream" id="cardStream">
    <p class="state-msg">Loading&hellip;</p>
  </div>

  <footer>
    <span class="footer-brand">Memoix</span>
    <nav class="footer-links">
      <a href="../features/index.html">Features</a>
      <a href="../about/index.html">About</a>
      <a href="https://github.com/dboiago/Memoix" target="_blank" rel="noopener">GitHub</a>
      <a href="../privacy/index.html">Privacy</a>
      <span class="current">Change Log</span>
    </nav>
    <span class="footer-salt">Built with salt.</span>
  </footer>

  <script>
    /* ── Nav ── */
    const navToggle  = document.getElementById('navToggle');
    const navOverlay = document.getElementById('navOverlay');

    navToggle.addEventListener('click', function () {
      const isOpen = navOverlay.classList.toggle('open');
      navToggle.classList.toggle('open', isOpen);
      navOverlay.setAttribute('aria-hidden', String(!isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    navOverlay.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        navOverlay.classList.remove('open');
        navToggle.classList.remove('open');
        navOverlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      });
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && navOverlay.classList.contains('open')) {
        navOverlay.classList.remove('open');
        navToggle.classList.remove('open');
        navOverlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
    });

    /* ── Changelog fetch and parse ── */
    const RAW_URL      = 'https://raw.githubusercontent.com/dboiago/Memoix/main/docs/CHANGELOG.md';
    const FALLBACK_URL = 'https://github.com/dboiago/Memoix/blob/main/docs/CHANGELOG.md';
    const stream       = document.getElementById('cardStream');

    function releaseType(version) {
      var match = version.match(/^v(\d+)\.(\d+)\.(\d+)/);
      if (!match) return 'patch';
      if (match[2] === '0' && match[3] === '0') return 'major';
      if (match[3] === '0') return 'minor';
      return 'patch';
    }

    function parseVersionLine(line) {
      var parts = line.replace(/^#+\s*/, '').split(' - ').map(function (p) { return p.trim(); });
      var version = null, title = null, date = null;
      parts.forEach(function (p) {
        if (/^v\d/.test(p))                    version = p;
        else if (/^\d{4}-\d{2}-\d{2}$/.test(p)) date = p;
        else if (/^The\s/i.test(p))              title = p;
      });
      return { version: version, title: title, date: date };
    }

    function parseChangelog(markdown) {
      var lines    = markdown.split('\n');
      var releases = [];
      var current  = null;
      var category = null;

      lines.forEach(function (line) {
        var trimmed = line.trim();

        if (/^##\s/.test(trimmed)) {
          if (current) releases.push(current);
          var parsed = parseVersionLine(trimmed);
          current = {
            version:  parsed.version || '',
            title:    parsed.title   || null,
            date:     parsed.date    || '',
            groups:   {}
          };
          category = null;

        } else if (/^###\s/.test(trimmed)) {
          category = trimmed.replace(/^###\s*/, '').toLowerCase().trim();
          if (current && !current.groups[category]) {
            current.groups[category] = [];
          }

        } else if (/^-\s/.test(trimmed) && current && category) {
          current.groups[category].push(trimmed.replace(/^-\s*/, ''));
        }
      });

      if (current) releases.push(current);
      return releases;
    }

    function buildOffsets(count) {
      var offsets = [];
      var run = 0;
      var last = null;
      for (var i = 0; i < count; i++) {
        var flip = (last === 'left') ? 'right' : 'left';
        var chosen;
        if (last === null) {
          chosen = Math.random() < 0.5 ? 'left' : 'right';
        } else if (run >= 3) {
          chosen = flip;
        } else {
          chosen = Math.random() < 0.45 ? last : flip;
        }
        offsets.push(chosen);
        run = (chosen === last) ? run + 1 : 1;
        last = chosen;
      }
      return offsets;
    }

    var CATEGORY_ORDER = ['added', 'changed', 'fixed', 'removed'];

    function renderCard(release, offsetClass) {
      var type = releaseType(release.version);

      var versionLabel = release.version;
      if (release.title) versionLabel += ' - ' + release.title;

      // Build entry groups in canonical order
      var groupsHtml = '';
      var counts = {};
      var total  = 0;

      CATEGORY_ORDER.forEach(function (cat) {
        var entries = release.groups[cat];
        if (!entries || !entries.length) return;
        counts[cat] = entries.length;
        total += entries.length;

        var rowsHtml = entries.map(function (text) {
          return '<div class="entry-row">' +
            '<span class="entry-text">' + formatEntryText(text) + '</span>' +
            '<span class="entry-tag">' + capFirst(cat) + '</span>' +
            '</div>';
        }).join('');

        groupsHtml += '<div class="entry-group">' + rowsHtml + '</div>';
      });

      // Footer counts
      var countRowsHtml = CATEGORY_ORDER.filter(function (k) {
        return counts[k];
      }).map(function (k) {
        return '<div class="foot-row">' +
          '<span class="foot-label">' + capFirst(k) + '</span>' +
          '<span class="foot-val">' + counts[k] + '</span>' +
          '</div>';
      }).join('');

      return '<div class="release-card ' + offsetClass + '">' +
        '<div class="card-head">' +
          '<div>' +
            '<div class="card-version">' + escHtml(versionLabel) + '</div>' +
            '<div class="card-date">' + escHtml(release.date) + '</div>' +
          '</div>' +
          '<span class="release-type ' + type + '">' + capFirst(type) + '</span>' +
        '</div>' +
        '<div class="card-entries">' + groupsHtml + '</div>' +
        '<div class="card-foot">' +
          countRowsHtml +
          '<div class="foot-row total-row">' +
            '<span class="foot-label">Total</span>' +
            '<span class="foot-val">' + total + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Format entry text: escape HTML first, then apply inline styles
    // for backtick code spans and [Tag] patterns
    function formatEntryText(str) {
      var escaped = escHtml(str);
      // Backtick code spans: `code`
      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
      // [Tag] patterns at start or anywhere in the string
      escaped = escaped.replace(/\[([^\]]+)\]/g, '<span class="entry-bracket">[$1]</span>');
      return escaped;
    }

    function capFirst(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    fetch(RAW_URL)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (markdown) {
        var releases = parseChangelog(markdown);
        if (!releases.length) throw new Error('empty');
        var offsets = buildOffsets(releases.length);
        var html = releases.map(function (r, i) {
          return renderCard(r, 'offset-' + offsets[i]);
        }).join('');
        stream.innerHTML = html;
      })
      .catch(function () {
        stream.innerHTML =
          '<p class="state-msg">Unable to load the changelog. ' +
          'View it on <a href="' + FALLBACK_URL +
          '" target="_blank" rel="noopener">GitHub</a>.</p>';
      });
  </script>

</body>
</html>
