<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy - Memoix</title>
  <meta name="description" content="Privacy policy for Memoix." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Cormorant+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #e8b4a0;
      --ink-soft:  #e8d5c4;
      --ink-muted: #9b9b9b;
      --rule:      #3f3f46;
      --paper:     #242424;
      --paper-dark:#1a1a1a;
    }

    body {
      background: var(--paper);
      color: var(--ink-soft);
      font-family: 'EB Garamond', serif;
      line-height: 1.7;
      font-size: 18px;
      overflow-x: hidden;
    }

    /* ── NAV ─────────────────────────────────────── */

    .nav-top {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 1.6rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 400;
      pointer-events: none;
    }

    .back-link {
      font-family: 'Cormorant SC', serif;
      color: var(--ink-muted);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: color 0.2s;
      pointer-events: all;
    }
    .back-link:hover { color: var(--ink); }

    .nav-toggle {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px;
      pointer-events: all;
    }
    .nav-toggle span {
      display: block;
      width: 20px;
      height: 1px;
      background: var(--ink-muted);
      transition: background 0.2s, opacity 0.2s, transform 0.25s;
    }
    .nav-toggle:hover span { background: var(--ink); }
    .nav-toggle.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); background: var(--ink); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); background: var(--ink); }

    .nav-overlay {
      position: fixed;
      inset: 0;
      background: var(--paper-dark);
      z-index: 300;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 8vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.open { opacity: 1; pointer-events: all; }

    .nav-overlay a,
    .nav-link-current {
      font-family: 'Cormorant SC', serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.06em;
      line-height: 1.3;
      display: block;
      margin-bottom: 0.5rem;
      text-decoration: none;
    }
    .nav-overlay a { color: var(--ink-muted); transition: color 0.2s; }
    .nav-overlay a:hover { color: var(--ink); }
    .nav-link-current { color: var(--ink); cursor: default; }

    .nav-rule { width: 2rem; height: 1px; background: var(--rule); margin: 2rem 0; }
    .nav-meta {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }

    /* ── CONTENT ─────────────────────────────────── */

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 10rem 2rem 6rem;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 5rem);
      color: var(--ink);
      line-height: 0.95;
      margin-bottom: 1.5rem;
    }

    .page-meta {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: var(--ink-muted);
      text-transform: uppercase;
      margin-bottom: 4rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--rule);
    }

    .state-msg {
      font-family: 'Cormorant SC', serif;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 2rem 0;
    }

    .state-msg a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      transition: border-color 0.2s;
    }
    .state-msg a:hover { border-color: var(--ink); }

    /* ── MARKDOWN CONTENT STYLES ─────────────────── */

    #policy-content h1 { display: none; }

    #policy-content h2 {
      font-family: 'Cormorant SC', serif;
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink);
      margin-top: 3rem;
      margin-bottom: 1.2rem;
      padding-top: 3rem;
      border-top: 1px solid var(--rule);
    }

    #policy-content h2:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }

    #policy-content h3 {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 1.8rem;
      margin-bottom: 0.8rem;
    }

    #policy-content p {
      font-size: 1rem;
      color: var(--ink-soft);
      line-height: 1.85;
      margin-bottom: 0.85rem;
    }

    #policy-content p:last-child { margin-bottom: 0; }

    #policy-content a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      transition: border-color 0.2s;
    }
    #policy-content a:hover { border-color: var(--ink); }

    #policy-content strong {
      color: var(--ink-soft);
      font-weight: 500;
    }

    #policy-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.92rem;
    }

    #policy-content th {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--rule);
      text-align: left;
    }

    #policy-content td {
      padding: 0.5rem 0.75rem;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--rule);
      vertical-align: top;
    }

    #policy-content code {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--ink-muted);
      background: var(--paper-dark);
      padding: 0.1em 0.35em;
      border-radius: 2px;
    }

    /* ── FOOTER ──────────────────────────────────── */

    footer {
      border-top: 1px solid var(--rule);
      padding: 2rem;
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
    }

    .footer-brand {
      font-family: 'Cormorant SC', serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }

    .footer-links {
      display: flex;
      gap: 1.8rem;
      justify-content: center;
    }

    .footer-links a,
    .footer-links .current {
      font-family: 'Cormorant SC', serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: none;
    }
    .footer-links a { color: var(--ink-muted); transition: color 0.2s; }
    .footer-links a:hover { color: var(--ink-soft); }
    .footer-links .current { color: var(--ink); cursor: default; }

    .footer-salt {
      font-family: 'EB Garamond', serif;
      font-size: 0.85rem;
      font-style: italic;
      color: var(--ink-muted);
      text-align: right;
    }

    /* ── RESPONSIVE ──────────────────────────────── */

    @media (max-width: 600px) {
      footer { grid-template-columns: 1fr; text-align: center; gap: 1.2rem; }
      .footer-links { flex-wrap: wrap; justify-content: center; }
      .footer-salt { text-align: center; }
      #policy-content table { font-size: 0.82rem; }
      #policy-content th,
      #policy-content td { padding: 0.4rem 0.5rem; }
    }
  </style>
</head>
<body>

  <div class="nav-top">
    <a href="../index.html" class="back-link">&larr; Return</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="nav-overlay" id="navOverlay" aria-hidden="true">
    <img src="../assets/logo.svg" style="position: absolute; bottom: -5%; right: -5%; width: 60%; opacity: 0.06; pointer-events: none; z-index: -1; filter: grayscale(1);" alt="" />
    <a href="../features/index.html">Features</a>
    <a href="../about/index.html">About</a>
    <a href="https://github.com/dboiago/Memoix" target="_blank" rel="noopener">Source</a>
    <div class="nav-rule"></div>
    <p class="nav-meta">Memoix &mdash; 2026</p>
  </nav>

  <main>
    <h1 class="page-title">Privacy.</h1>
    <p class="page-meta" id="pageMeta">Memoix</p>
    <div id="policy-content">
      <p class="state-msg">Loading&hellip;</p>
    </div>
  </main>

  <footer>
    <span class="footer-brand">Memoix</span>
    <nav class="footer-links">
      <a href="../features/index.html">Features</a>
      <a href="../about/index.html">About</a>
      <a href="https://github.com/dboiago/Memoix" target="_blank" rel="noopener">GitHub</a>
      <span class="current">Privacy</span>
      <a href="../changelog/index.html">Change Log</a>
    </nav>
    <span class="footer-salt">Built with salt.</span>
  </footer>

  <script>
    /* ── Nav ── */
    const navToggle  = document.getElementById('navToggle');
    const navOverlay = document.getElementById('navOverlay');

    navToggle.addEventListener('click', function () {
      const isOpen = navOverlay.classList.toggle('open');
      navToggle.classList.toggle('open', isOpen);
      navOverlay.setAttribute('aria-hidden', String(!isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    navOverlay.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        navOverlay.classList.remove('open');
        navToggle.classList.remove('open');
        navOverlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      });
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && navOverlay.classList.contains('open')) {
        navOverlay.classList.remove('open');
        navToggle.classList.remove('open');
        navOverlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
    });

    /* ── Markdown fetch and render ── */
    const RAW_URL      = 'https://raw.githubusercontent.com/dboiago/Memoix/main/PRIVACY.md';
    const FALLBACK_URL = 'https://github.com/dboiago/Memoix/blob/main/PRIVACY.md';
    const contentEl    = document.getElementById('policy-content');
    const metaEl       = document.getElementById('pageMeta');

    marked.setOptions({ breaks: false, gfm: true });

    // Extract "Last updated: <value>" from the markdown header block.
    // The header block is everything before the first ## heading.
    function extractLastUpdated(markdown) {
      var headerBlock = markdown.split(/^##\s/m)[0];
      var match = headerBlock.match(/\*\*Last updated:\*\*\s*(.+)/i);
      return match ? match[1].trim() : null;
    }

    // Strip everything before the first ## heading.
    function stripHeader(markdown) {
      var idx = markdown.search(/^##\s/m);
      return idx !== -1 ? markdown.slice(idx) : markdown;
    }

    fetch(RAW_URL)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (markdown) {
        // Extract date and update meta line
        var lastUpdated = extractLastUpdated(markdown);
        if (lastUpdated) {
          metaEl.textContent = 'Memoix \u2014 Last updated ' + lastUpdated;
        } else {
          metaEl.textContent = 'Memoix';
        }

        // Strip header block then render
        var body = stripHeader(markdown);
        contentEl.innerHTML = marked.parse(body);
      })
      .catch(function () {
        metaEl.textContent = 'Memoix';
        contentEl.innerHTML =
          '<p class="state-msg">Unable to load the privacy policy. ' +
          'View it directly on <a href="' + FALLBACK_URL +
          '" target="_blank" rel="noopener">GitHub</a>.</p>';
      });
  </script>

</body>
</html>
